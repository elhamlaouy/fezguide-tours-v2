# Template for scripts/cms-preview.mjs ONLY. Never deploy; no provisioned resources.
name = "fez-cms-owner-preview"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/*", "!/assets/*", "!/images/*", "!/fonts/*", "!/favicon.svg"]
[[d1_databases]]
binding = "CMS_DB"
database_name = "fez-cms-preview"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[[r2_buckets]]
binding = "CMS_MEDIA"
bucket_name = "fez-cms-media-preview"
[images]
binding = "CMS_IMAGES"
