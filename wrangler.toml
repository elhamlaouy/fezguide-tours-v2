name = "fezguidetours"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "CMS_KV"
id = "49f69448fb834d4496a05e0d41b19b3c"

# CMS content is public and this Worker exposes the binding read-only.
# Reuse it for Cloudflare's branch preview so preview builds can start.
[[previews.kv_namespaces]]
binding = "CMS_KV"
id = "49f69448fb834d4496a05e0d41b19b3c"
