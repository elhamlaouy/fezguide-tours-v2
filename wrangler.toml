name = "fezguidetours-v2"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
account_id = "417f3820605485ace5bdbb9576452f42"

[[d1_databases]]
binding = "CMS_DB"
database_name = "fezguidetours-cms-v2"
database_id = "edb04713-e9ba-4b72-b967-7909d9ab61af"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CMS_MEDIA"
bucket_name = "fezguidetours-cms-media-v2"

[images]
binding = "CMS_IMAGES"

[[ratelimits]]
name = "CMS_PUBLIC_RATE_LIMITER"
namespace_id = "5845630505"
simple = { limit = 600, period = 60 }

[[previews.ratelimits]]
name = "CMS_PUBLIC_RATE_LIMITER"
namespace_id = "9478478740"
simple = { limit = 600, period = 60 }


[vars]
CANONICAL_ORIGIN = "https://fezguidetours.com"
ACCESS_TEAM_DOMAIN = "delicate-forest-c939.cloudflareaccess.com"
ACCESS_AUD = "32271121f6e019de0d240549fafa28ce5232448badca6d0e8350b8111e718061"
ACCESS_ALLOWED_EMAILS = "elhamlaouy@gmail.com,fezguidetours1@gmail.com"
CMS_PUBLIC_RATE_LIMIT_REQUIRED = "true"

[previews.vars]
CANONICAL_ORIGIN = "https://fezguidetours.com"
ACCESS_TEAM_DOMAIN = "delicate-forest-c939.cloudflareaccess.com"
# TODO: replace with the v2 preview Access app AUD once the preview deployment hostname is known
ACCESS_AUD = "32271121f6e019de0d240549fafa28ce5232448badca6d0e8350b8111e718061"
ACCESS_ALLOWED_EMAILS = "elhamlaouy@gmail.com,fezguidetours1@gmail.com"
CMS_PUBLIC_RATE_LIMIT_REQUIRED = "true"

[[previews.d1_databases]]
binding = "CMS_DB"
database_name = "fezguidetours-cms-preview-v2"
database_id = "cf43b67c-6f6a-4348-8444-361f0c796a5d"

[[previews.r2_buckets]]
binding = "CMS_MEDIA"
bucket_name = "fezguidetours-cms-media-preview-v2"

[previews.images]
binding = "CMS_IMAGES"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*", "!/assets/*", "!/images/*", "!/fonts/*", "!/favicon.svg"]

[[kv_namespaces]]
binding = "CMS_KV"
id = "877026740d534091b2f44c57a1566a54"

# CMS content is public and this Worker exposes the binding read-only.
# Preview gets its own KV namespace (the old project shared one KV between prod and preview).
[[previews.kv_namespaces]]
binding = "CMS_KV"
id = "aa07fcc67f0245d1876b1d7cd0379884"
