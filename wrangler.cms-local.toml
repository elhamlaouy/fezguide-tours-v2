# Local D1 proof only. Do not deploy this file and do not pass --remote.
# database_id is a placeholder, not a provisioned Cloudflare database.
name = "fezguidetours-cms-local"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/*", "!/assets/*", "!/images/*", "!/fonts/*", "!/favicon.svg"]

[[d1_databases]]
binding = "CMS_DB"
database_name = "fez-cms-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Local-only R2 placeholder. No remote bucket is provisioned.
[[r2_buckets]]
binding = "CMS_MEDIA"
bucket_name = "fez-cms-media-local"

# Real decoding/re-encoding; Wrangler provides an offline local implementation.
[images]
binding = "CMS_IMAGES"
